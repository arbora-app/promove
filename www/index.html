<style>
:root{
  --ui:"Manrope","Helvetica Neue",Arial,sans-serif;

  --sky1:#E9EEF0; --sky2:#D2DADE; --sky3:#BCC6CA; --streak:rgba(255,255,255,.55); --mull:rgba(255,255,255,.35);

  --g-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 22px 40px -26px rgba(20,40,50,.45); --solid-fill:linear-gradient(160deg,rgba(247,249,250,.95),rgba(236,240,242,.93)); --day-fill:rgba(255,255,255,.45); --card-fill:linear-gradient(160deg,rgba(255,255,255,.86),rgba(246,249,250,.78)); --day-ring:rgba(20,40,50,.14);
  --field:rgba(255,255,255,.62); --field-in:inset 0 1px 2px rgba(20,40,50,.14),inset 0 0 0 1px rgba(20,40,50,.12);
  --ti:linear-gradient(180deg,#FAFBFB 0%,#DCE1E4 40%,#BEC5CA 54%,#E9ECEE 100%); --ti-ink:#1A2226;
  --ti-sh:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.28),0 8px 16px -9px rgba(0,0,0,.45);
  --tk:linear-gradient(180deg,#4A5358,#22292D 55%,#353D42); --tk-ink:#FFFFFF;
  --tk-sh:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 .5px rgba(0,0,0,.6),0 10px 20px -10px rgba(0,0,0,.6);
  --rec:linear-gradient(180deg,#2A3236,#11171A); --rec-ink:#fff; --rec-sh:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.75);
  --bar:linear-gradient(180deg,#F4F6F7 0%,#D3D9DD 46%,#B8C0C5 58%,#DDE2E5 100%);
  --bar-sh:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.2),0 -12px 30px -14px rgba(0,0,0,.35);
  --cu:linear-gradient(180deg,#F1BE98 0%,#C9774A 55%,#E0A07A 100%); --cu-ink:#2A1408; --cu-sh:inset 0 1px 0 rgba(255,240,228,.9),0 0 0 .5px rgba(80,30,10,.45);
  --cop:#8F4520; --leaf:#24804D;
  --lit:linear-gradient(180deg,#72CF97,#2C8A55); --lit-glow:0 0 10px rgba(80,200,130,.5);

  color-scheme:light;
}

  --sky1:#1C2328; --sky2:#13181C; --sky3:#0C1013; --streak:rgba(255,255,255,.05); --mull:rgba(255,255,255,.04);
  --tr1:#16301F; --tr2:#1D3A24; --tr3:#122A1B; --tr4:#1B3522;

  --g-fill:linear-gradient(160deg,rgba(44,54,60,.62),rgba(20,27,31,.5));
  --g-edge:linear-gradient(150deg,rgba(255,255,255,.32),rgba(255,255,255,.04) 45%,rgba(255,255,255,.14));
  --g-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 22px 40px -24px rgba(0,0,0,.85); --solid-fill:linear-gradient(160deg,rgba(36,44,49,.96),rgba(22,28,32,.95)); --day-fill:rgba(255,255,255,.05); --card-fill:linear-gradient(160deg,rgba(46,56,62,.9),rgba(28,35,39,.88)); --day-ring:rgba(255,255,255,.12);
  --field:rgba(0,0,0,.28); --field-in:inset 0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1);
  --ti:linear-gradient(180deg,#6B7378 0%,#454C51 42%,#30363A 56%,#4E565B 100%); --ti-ink:#EEF2F3;
  --ti-sh:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.6),0 8px 16px -9px rgba(0,0,0,.7);
  --tk:linear-gradient(180deg,#FAFBFB 0%,#DCE1E4 40%,#BEC5CA 54%,#E9ECEE 100%); --tk-ink:#141A1D;
  --tk-sh:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.2),0 10px 20px -10px rgba(0,0,0,.8);
  --rec:linear-gradient(180deg,#0B0F11,#1C2327); --rec-ink:#fff; --rec-sh:inset 0 1px 2px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.18);
  --bar:linear-gradient(180deg,#5C6469 0%,#3A4146 46%,#2A2F33 58%,#40474C 100%);
  --bar-sh:inset 0 1px 0 rgba(255,255,255,.28),0 -12px 30px -14px rgba(0,0,0,.85);
  --cop:#E9A87F; --leaf:#7ED3A0;
  --lit:linear-gradient(180deg,#86E3AB,#3AA76A); --lit-glow:0 0 10px rgba(90,210,140,.5);
  --cap-empty:rgba(255,255,255,.06); --cap-ring:rgba(255,255,255,.28);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1215;
  --sky1:#1C2328; --sky2:#13181C; --sky3:#0C1013; --streak:rgba(255,255,255,.05); --mull:rgba(255,255,255,.04);
  --tr1:#16301F; --tr2:#1D3A24; --tr3:#122A1B; --tr4:#1B3522;
  --ink:#EEF2F1; --soft:#B3BDBA; --hair:rgba(255,255,255,.1);
  --g-fill:linear-gradient(160deg,rgba(44,54,60,.62),rgba(20,27,31,.5));
  --g-edge:linear-gradient(150deg,rgba(255,255,255,.32),rgba(255,255,255,.04) 45%,rgba(255,255,255,.14));
  --g-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 22px 40px -24px rgba(0,0,0,.85); --solid-fill:linear-gradient(160deg,rgba(36,44,49,.96),rgba(22,28,32,.95)); --day-fill:rgba(255,255,255,.05); --card-fill:linear-gradient(160deg,rgba(46,56,62,.9),rgba(28,35,39,.88)); --day-ring:rgba(255,255,255,.12);
  --field:rgba(0,0,0,.28); --field-in:inset 0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1);
  --ti:linear-gradient(180deg,#6B7378 0%,#454C51 42%,#30363A 56%,#4E565B 100%); --ti-ink:#EEF2F3;
  --ti-sh:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.6),0 8px 16px -9px rgba(0,0,0,.7);
  --tk:linear-gradient(180deg,#FAFBFB 0%,#DCE1E4 40%,#BEC5CA 54%,#E9ECEE 100%); --tk-ink:#141A1D;
  --tk-sh:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.2),0 10px 20px -10px rgba(0,0,0,.8);
  --rec:linear-gradient(180deg,#0B0F11,#1C2327); --rec-ink:#fff; --rec-sh:inset 0 1px 2px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.18);
  --bar:linear-gradient(180deg,#5C6469 0%,#3A4146 46%,#2A2F33 58%,#40474C 100%);
  --bar-sh:inset 0 1px 0 rgba(255,255,255,.28),0 -12px 30px -14px rgba(0,0,0,.85);
  --cop:#E9A87F; --leaf:#7ED3A0;
  --lit:linear-gradient(180deg,#86E3AB,#3AA76A); --lit-glow:0 0 10px rgba(90,210,140,.5);

  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
body.locked{overflow:hidden}
:root[lang="fa"] body,:root[lang="fa"] button,:root[lang="fa"] input,:root[lang="fa"] textarea,:root[lang="fa"] select{font-family:"Vazirmatn",var(--ui)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

/* view behind the glass */
.outside{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:radial-gradient(70% 30% at 85% 0%,var(--streak),transparent 70%),
    linear-gradient(100deg,transparent 0 16%,var(--streak) 21%,transparent 27% 57%,var(--streak) 61%,transparent 66%),
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%)}
.outside::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--mull) calc(25% - 1px) 25%)}
.outside::after{content:"";position:absolute;left:-20px;right:-20px;bottom:64px;height:120px;filter:blur(8px);
  background:radial-gradient(16% 70% at 6% 100%,var(--tr1) 0,transparent 72%),radial-gradient(13% 58% at 26% 100%,var(--tr2) 0,transparent 72%),
    radial-gradient(18% 78% at 52% 100%,var(--tr3) 0,transparent 72%),radial-gradient(14% 60% at 74% 100%,var(--tr2) 0,transparent 72%),
    radial-gradient(15% 66% at 94% 100%,var(--tr4) 0,transparent 72%)}

/* materials */
.glass{position:relative;border-radius:24px;background:var(--g-fill);box-shadow:var(--g-shadow);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:var(--g-edge);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.ti{background:var(--ti);color:var(--ti-ink);box-shadow:var(--ti-sh)}
.tk{background:var(--tk);color:var(--tk-ink);box-shadow:var(--tk-sh)}
.cu{background:var(--cu);color:var(--cu-ink);box-shadow:var(--cu-sh)}

/* page frame */
.page{max-width:620px;margin:0 auto;padding:0 16px 150px}
.topbar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 12px 8px 16px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:10px;min-height:56px}
.mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em}
.switcher{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:none;padding:6px 4px;min-height:44px;cursor:pointer;font-weight:700;font-size:15px;text-align:start}
.switcher span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switcher svg{width:16px;height:16px;flex:none;opacity:.6}
.iconbtn{margin-inline-start:auto;flex:none;width:44px;height:44px;border:0;border-radius:22px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.lab{display:block;font-size:11.5px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;color:var(--soft)}
:root[lang="fa"] .lab{letter-spacing:0;font-size:12px}
.muted{color:var(--soft)}
.banner{margin-top:12px;padding:12px 16px;border-radius:18px;font-size:13.5px;font-weight:600}

h1.title{margin:26px 0 6px;font-size:34px;font-weight:300;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.sub{margin:0;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:0 13px;border-radius:15px;border:0;font-size:12.5px;font-weight:650;white-space:nowrap;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip.sm{min-height:22px;padding:0 9px;border-radius:11px;font-size:11px}
.chip.dashed{background:none;box-shadow:none;border:1px dashed var(--soft);color:var(--soft)}
.chip.ok{color:var(--leaf)} .chip.w{color:var(--cop)}
.section{margin-top:28px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 10px}
.sec-hd h2{margin:0;font-size:20px;font-weight:350;letter-spacing:-.015em}
.pad{padding:18px}
.card p{margin:4px 0 0;overflow-wrap:anywhere}
.big{font-size:18px;line-height:1.4;font-weight:550}
.gap{height:14px}
.empty-note{color:var(--soft);font-style:normal}

/* buttons */
.btn{min-height:46px;padding:0 20px;border-radius:23px;border:0;font-size:14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:center;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn.sm{min-height:36px;padding:0 14px;border-radius:18px;font-size:13px}
.btn.link{background:none;box-shadow:none;color:var(--leaf);padding:0 6px;min-height:44px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.acts{margin-top:14px}

/* up next */
.upnext{margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.uplist{list-style:none;margin:8px 0 0;padding:0}
.uplist li{display:flex;align-items:center;gap:8px;padding:6px 0}
.uplist li+li{border-top:1px solid var(--hair)}
.uplist .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14.5px}
.uplist .more{width:36px;height:36px;border:0;background:none;border-radius:18px;display:grid;place-items:center;cursor:pointer;color:var(--soft);flex:none}
.uplist .more svg{width:18px;height:18px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}

/* fields */
.inp,.field input,.field textarea,.field select{width:100%;border:0;border-radius:14px;background:var(--field);box-shadow:var(--field-in);color:var(--ink);padding:11px 14px;min-height:46px;font-size:16px}
.field textarea{min-height:84px;resize:vertical;line-height:1.45}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-inline-end:36px}
:root[dir="rtl"] .field select{background-position:20px 50%,14px 50%}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field .hint{font-size:12px;color:var(--soft)}
.field .err{font-size:12.5px;color:var(--cop);font-weight:650}
.field.bad input,.field.bad textarea,.field.bad select{box-shadow:inset 0 0 0 1.5px #C9774A}
.fgroup{margin-top:22px;padding-top:4px}
.fgroup>.lab{color:var(--ink);opacity:.85;font-size:11.5px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:20px;gap:2px}
.seg button{border:0;background:none;min-height:36px;min-width:44px;padding:0 13px;border-radius:17px;font-size:13px;font-weight:600;cursor:pointer;color:inherit;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--rec);color:var(--rec-ink);box-shadow:var(--rec-sh);opacity:1}
.stepper{display:inline-flex;align-items:center;border-radius:23px;height:46px;padding:0 4px;align-self:flex-start}
.stepper button{width:40px;height:40px;border:0;border-radius:20px;background:none;font-size:20px;cursor:pointer}
.stepper output{min-width:30px;text-align:center;font-weight:700}
.switch{display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:0;min-height:44px;cursor:pointer;font-size:14px;font-weight:600;text-align:start}
.switch i{position:relative;width:50px;height:30px;border-radius:15px;background:var(--field);box-shadow:var(--field-in);transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--ti);box-shadow:var(--ti-sh);transition:inset-inline-start .2s}
.switch[aria-checked="true"] i{background:linear-gradient(180deg,#5FC48A,#2C8A55)}
.switch[aria-checked="true"] i::after{inset-inline-start:23px}

/* caps & clocks */
.caps{display:inline-flex;gap:4px;flex:none;flex-wrap:wrap}
.caps i{width:16px;height:7px;border-radius:4px;background:var(--cap-empty);box-shadow:inset 0 0 0 1px var(--cap-ring)}
.caps i.on{background:var(--lit);box-shadow:var(--lit-glow)}
.caps i.over{background:var(--cu);box-shadow:inset 0 1px 0 rgba(255,240,228,.8)}
.caps i.off{background:none;box-shadow:inset 0 0 0 1px var(--cap-ring);opacity:.6}
.clocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.clock{padding:11px 12px;border-radius:15px;min-width:0}
.clock .lab{color:inherit;opacity:.65}
.clock .v{display:block;font-size:15px;font-weight:700;margin-top:3px}
.clock .s{display:block;font-size:11.5px;opacity:.7}
.clock.w .v{color:var(--cop)}
.disclose{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:0;min-height:44px;cursor:pointer;font-weight:650;font-size:14px}
.disclose svg{width:18px;height:18px;transition:transform .2s}
.disclose[aria-expanded="true"] svg{transform:rotate(180deg)}
dl.facts{margin:0}
dl.facts dt{margin-top:12px}
dl.facts dd{margin:3px 0 0;overflow-wrap:anywhere}
dl.facts ul{margin:0;padding-inline-start:18px}

/* portfolio */
.rows{padding:4px 18px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;width:100%;padding:15px 0;border:0;background:none;text-align:start;cursor:pointer;color:inherit}
.prow+.prow{border-top:1px solid var(--hair)}
.prow h3{margin:0;font-size:16px;font-weight:650;overflow-wrap:anywhere}
.prow .chip{align-self:center}
.prow .meta{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft)}
.prow .nx{grid-column:1/-1;font-size:13px;overflow-wrap:anywhere}
.prow .nx span:first-child{color:var(--soft)}
.emptybox{text-align:center;padding:30px 20px}
.emptybox h2{margin:0 0 6px;font-size:22px;font-weight:350}
.emptybox p{margin:0 auto 18px;color:var(--soft);max-width:36ch}
.emptybox .btns{justify-content:center}

/* history */
.hist{list-style:none;margin:0;padding:0}
.hcard{display:block;width:100%;text-align:start;border:0;padding:14px 16px;margin-bottom:10px;cursor:pointer;color:inherit}
.hcard .when{font-size:12px;color:var(--soft)}
.hcard .what{display:block;font-size:14.5px;font-weight:650;margin-top:2px}
.hcard .ex{display:block;font-size:13px;color:var(--soft);margin-top:4px;overflow-wrap:anywhere}
.hcard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* diff */
.diff{list-style:none;margin:0;padding:0}
.diff li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:2px 12px;padding:11px 0;border-top:1px solid var(--hair);font-size:14px}
.diff .k{grid-row:span 3;font-size:12px;color:var(--soft);font-weight:650;padding-top:2px}
.diff .old{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--cop);overflow-wrap:anywhere;white-space:pre-line}
.diff .new{grid-column:2;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.diff .add{color:var(--leaf)}
.diff .rem{color:var(--cop);text-decoration:line-through}
.diff .none{color:var(--soft);font-weight:400;font-style:italic}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,16,18,.38);display:flex;align-items:flex-end;justify-content:center;padding:10px}
.sheet.glass,.topbar.glass{background:var(--solid-fill)}
.sheet{width:100%;max-width:580px;max-height:calc(100dvh - 20px);display:flex;flex-direction:column;border-radius:30px;overflow:hidden}
.sheet-hd{display:flex;align-items:center;gap:10px;padding:14px 12px 8px 20px}
.sheet-hd h2{margin:0;font-size:19px;font-weight:600;flex:1;min-width:0}
.sheet-bd{padding:4px 20px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-ft{padding:12px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--hair)}
.note{font-size:13px;color:var(--soft);margin:6px 0 0;line-height:1.5}
.picklist{list-style:none;margin:0;padding:0}
.picklist button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:0;background:none;padding:12px 4px;min-height:48px;cursor:pointer;font-size:15px;color:inherit;border-top:1px solid var(--hair)}
.picklist li:first-child button{border-top:0}
.picklist button[aria-current="true"]{font-weight:700}
.picklist small{display:block;color:var(--soft);font-size:12.5px}
.checklist{list-style:none;margin:8px 0 0;padding:0}
.checklist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--hair);font-size:13.5px}
.checklist b{font-size:14px}
.okmark{color:var(--leaf);font-weight:800}.badmark{color:var(--cop);font-weight:800}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:25;width:calc(100% - 32px);max-width:560px;border-radius:22px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.toast span{flex:1}
.toast .btn{min-height:36px}

/* tab bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));z-index:10;width:calc(100% - 20px);max-width:600px;border-radius:28px;padding:7px 6px;background:var(--bar);box-shadow:var(--bar-sh)}
.tabs nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:2px 0;min-height:52px;cursor:pointer;font-size:10.5px;font-weight:600;color:var(--ti-ink);opacity:.72}
.tab b{width:48px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab svg{width:21px;height:21px}
.tab[aria-current="page"]{opacity:1}
.tab[aria-current="page"] b{background:var(--rec);color:var(--rec-ink);box-shadow:var(--rec-sh)}
:root[lang="fa"] .tab{font-size:11.5px}

/* movements: two panes and a seam */
body.split-mode{overflow:hidden}
body.split-mode .page{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
.split{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:10px}
.split.dragging{user-select:none;-webkit-user-select:none}
.pane{display:flex;flex-direction:column;min-height:70px;min-width:0;overflow:hidden}
#calPane{height:50%;border-radius:22px;flex:none}
#tlPane{flex:1;min-height:70px;position:relative}
.pscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wdrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:10px 10px 4px;font-size:11px;font-weight:700;color:var(--soft);text-align:center;border-bottom:1px solid var(--hair)}
#calScroll{padding:0 10px 8px;position:relative}
.cmonth-hd{margin:12px 2px 6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
:root[lang="fa"] .cmonth-hd{text-transform:none;letter-spacing:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-grid .blank{min-height:46px}
.day{position:relative;min-height:46px;border:0;border-radius:12px;padding:6px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
  background:var(--day-fill);box-shadow:inset 0 0 0 .5px var(--day-ring);color:var(--ink);font-size:13px}
.day.dim .mdot{opacity:.25}
.day .n{font-weight:650;line-height:1}
.day.fut .n{opacity:.78}
.day .w{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:5px}
.day .w i{width:9px;height:5px;border-radius:3px;background:var(--lit);box-shadow:var(--lit-glow)}
.day .w i.est{background:none;box-shadow:inset 0 0 0 1px var(--leaf)}
.day .w b{font-size:9px;line-height:5px;color:var(--soft)}
.day .mdot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--tk);box-shadow:0 0 0 1px var(--day-fill)}
.day.cp{box-shadow:inset 0 0 0 1.5px #C9774A}
.day.oldcp{box-shadow:inset 0 0 0 1.5px rgba(201,119,74,.45);background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(201,119,74,.12) 4px 5px)}
.day.act{background:var(--ti);box-shadow:var(--ti-sh);color:var(--ti-ink)}
.day.today .n{color:var(--leaf);font-weight:800}
.day.sel{background:var(--rec);color:var(--rec-ink);box-shadow:var(--rec-sh)}
.day.sel .n{color:var(--rec-ink)}
.day.sel .mdot{background:var(--rec-ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:7px 12px 9px;font-size:11px;color:var(--soft);border-top:1px solid var(--hair)}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:12px;height:6px;border-radius:3px}
.legend .lw{background:var(--lit)} .legend .le{box-shadow:inset 0 0 0 1px var(--leaf)} .legend .lev{border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--cop)}
.legend .lm{width:6px;height:6px;border-radius:50%;background:var(--tk)}
.legend .lf{width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.5px #C9774A}
.seam{flex:none;height:22px;display:grid;place-items:center;position:relative;touch-action:none;cursor:row-resize;z-index:2}
.seam::before{content:"";position:absolute;left:0;right:0;top:-10px;bottom:-10px}
.seam .grip{display:block;width:46px;height:7px;border-radius:4px;transition:width .2s,height .2s}
.seam.dragging .grip,.seam:hover .grip{width:58px;height:8px}
.seam:focus-visible{outline:none}.seam:focus-visible .grip{outline:2px solid var(--leaf);outline-offset:3px}
@media (min-width:900px) and (min-height:540px){
  .split{flex-direction:row}
  #calPane{height:auto;width:42%}
  .seam{width:22px;height:auto;cursor:col-resize}
  .seam::before{top:0;bottom:0;left:-10px;right:-10px}
  .seam .grip{width:7px;height:46px}
  .seam.dragging .grip,.seam:hover .grip{width:8px;height:58px}
  body.split-mode .page{max-width:1100px}
}
/* performance: no live blur inside the split view. Blurring under two scrolling panes is what made
   dragging stutter and the calendar flicker; the panes use the denser solid glass fill instead. */
.split .glass,.split .panel{-webkit-backdrop-filter:none;backdrop-filter:none}
.split .panel{position:relative;background:var(--solid-fill);box-shadow:var(--g-shadow)}
.split .panel::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:var(--g-edge);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.split .mv.glass{background:var(--card-fill)}
.pane,.pscroll{contain:layout paint}
#calScroll{transform:translateZ(0)}
.split.dragging *{transition:none!important}
.split.dragging .pscroll{pointer-events:none}
/* zoom rail */
#tlScroll.has-rail{padding-inline-end:46px}
.railwrap{position:absolute;inset-inline-end:2px;top:100px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:3;padding:4px 0;border-radius:20px;background:var(--solid-fill);box-shadow:var(--ti-sh)}
.railstep{width:36px;height:36px;border:0;background:none;border-radius:18px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.railstep svg{width:16px;height:16px}
.railstep:disabled{opacity:.25;cursor:default}
.zoomrail{display:flex;flex-direction:column-reverse;align-items:center;gap:9px;padding:8px 5px;touch-action:none;cursor:ns-resize}
.zoomrail:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:8px}
.rung{width:var(--rw,20px);height:4px;border-radius:2px;background:var(--cap-ring);opacity:.6;transition:background .2s,opacity .2s}
.rung.lit{background:var(--tk);opacity:1}
/* the legend is the filter */
.legend{flex-wrap:nowrap;gap:3px;padding:6px 6px 7px}
.lgbtn{flex:1 1 auto;min-width:0;justify-content:center;display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 6px;border-radius:17px;border:0;background:none;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--soft);white-space:nowrap;overflow:hidden}
.lgbtn i{flex:none}
.lgbtn .cnt{display:none}
@media (min-width:430px){.lgbtn .cnt{display:inline}}
@media (max-width:379px){.legend{gap:1px;padding:6px 4px 7px}.lgbtn{font-size:10.5px;padding:0 3px;gap:4px}.lgbtn .lw,.lgbtn .le,.lgbtn .lf{width:10px}}
.lgbtn[aria-pressed="true"]{background:var(--ti);box-shadow:var(--ti-sh);color:var(--ti-ink)}
.lgbtn[aria-pressed="false"] i{opacity:.35}
.lgbtn .cnt{opacity:.6;font-weight:500}
#calPane.hide-scheduled .day .w i.sch:not(.ev),#calPane.hide-event .day .w i.sch.ev{opacity:.15;box-shadow:none}
#calPane.hide-movement .day .mdot{opacity:.15}
#calPane.hide-checkpoint .day.cp,#calPane.hide-checkpoint .day.oldcp{box-shadow:inset 0 0 0 .5px var(--day-ring);background-image:none}
.cp-row{display:flex;align-items:center;gap:12px;margin:4px 0 12px;padding:10px 14px;border-radius:16px;font-size:13.5px;background:var(--day-fill);box-shadow:inset 0 0 0 1.5px rgba(201,119,74,.75)}
.cp-row.moved{box-shadow:inset 0 0 0 1px rgba(201,119,74,.4);background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(201,119,74,.07) 6px 7px)}
.cpbox{width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1.5px #C9774A;flex:none}
.cp-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.cp-txt .ex{color:var(--soft);font-size:12.5px;overflow-wrap:anywhere}
.cp-row .chip{flex:none}
.pname{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);margin-top:2px}
:root[lang="fa"] .pname{letter-spacing:0;text-transform:none;font-size:12px}
.att-row .pname{margin:0 0 2px;width:100%}
.att-row{flex-wrap:wrap}
.day.attoff .w{opacity:.25}
/* timeline pane */
#tlScroll{padding:0 2px 24px}
.tl-bar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl-bar .btn{flex:none;white-space:nowrap}
.tl-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 0;min-height:36px}
.tl-end{height:40vh}
.nearcap{position:absolute;top:44px;left:50%;transform:translateX(-50%);max-width:90%;padding:6px 12px;border-radius:14px;font-size:12.5px;font-weight:600;

.capnum.sm{font-size:26px;font-weight:400;letter-spacing:-.02em}

.panes{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;aspect-ratio:1/1;max-height:380px;width:100%}

/* floating buttons */
.fab{position:fixed;z-index:9;inset-inline-end:max(18px,calc((100vw - 620px) / 2 + 18px));bottom:calc(92px + env(safe-area-inset-bottom));border:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;min-width:46px;border-radius:23px;color:#fff;background:linear-gradient(180deg,#3E9C67 0%,#1F6E44 60%,#2A7E52 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.2),0 0 0 .5px rgba(10,70,35,.5),0 14px 28px -10px rgba(30,140,80,.75);text-shadow:0 1px 0 rgba(0,0,0,.18)}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.2),0 0 0 .5px rgba(10,70,35,.5),0 14px 28px -10px rgba(30,140,80,.75)}

.uphd{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* canvas */

   the caller persists S in one write, so a failure commits nothing. */
var PMM = (function(){
"use strict";

var FIELDS = ["name","outcome","goal","status","state","next","blockers","waitingOn","followUp",
  "pauseUntil","reconsiderOn","closeOutcome","prescription","commitment","commitM",
  "expChange","expEvidence","checkpoint","assess","assessWhy"];
var STATUSES = ["active","waiting","paused","inactive","closed"];
var ASSESS = ["","achieved","partly","not","unclear"];
var TREAT = ["","concentrated","limited","protected","maintenance","none"];
var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

function PMMError(code, detail){ var e = new Error(code); e.code = code; e.detail = detail; return e; }

function empty(){
  return { v:1, projects:{}, order:[], movements:[], annotations:{}, engagements:[], commands:{}, plans:[], capacity:{ def:6, weeks:{} },
    assessments:[], reviews:[], settings:{ reviewDay:5 }, scheduled:[], cpNotes:{}, mvNotes:{}, areas:[] };
}
/* older saved data gains the newer collections without changing anything already recorded */
function upgrade(S){
  if (!S.plans) S.plans = [];
  if (!S.capacity) S.capacity = { def:6, weeks:{} };
  if (!S.assessments) S.assessments = [];
  if (!S.reviews) S.reviews = [];
  if (!S.settings) S.settings = { reviewDay:5 };
  if (!S.scheduled) S.scheduled = [];
  if (!S.cpNotes) S.cpNotes = {};
  if (!S.mvNotes) S.mvNotes = {};
  if (!S.areas) S.areas = [];
  return S;
}
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function uid(){
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

/* attention is measured in hours, in steps of a quarter hour */
function q4(v){ var n = parseFloat(v); return isFinite(n) ? Math.round(n * 4) / 4 : 0; }
function floorQ(v){ return Math.floor(v * 4 + 1e-9) / 4; }
/* Canonical stored values: what counts as "the same". */
function canonField(f, v){
  if (f === "blockers"){
    var a = Array.isArray(v) ? v : String(v == null ? "" : v).split("\n");
    return a.map(function(s){ return String(s).replace(/\s+/g, " ").trim(); }).filter(Boolean);
  }
  if (f === "commitment"){
    var n = q4(v); return n > 0 ? n : 0;   /* hours, in quarter hours */
  }
  if (f === "commitM"){             /* planned sessions per 4 weeks; "" = not set yet (read as 4 × the weekly number) */
    if (v === "" || v == null) return "";
    var m = q4(v); return m > 0 ? m : 0;
  }
  if (f === "status") return STATUSES.indexOf(v) >= 0 ? v : "active";
  return String(v == null ? "" : v).replace(/\r\n?/g, "\n").replace(/[ \t]+\n/g, "\n").trim();
}
function canon(data){
  var out = {};
  FIELDS.forEach(function(f){ out[f] = canonField(f, data ? data[f] : undefined); });
  return out;
}
function same(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

/* Structural checks. Returns a list of {field, code}. */
function validate(d){
  var errs = [];
  if (!d.name) errs.push({field:"name", code:"required"});
  if (d.status === "waiting"){
    if (!d.waitingOn) errs.push({field:"waitingOn", code:"required"});
    if (!d.followUp) errs.push({field:"followUp", code:"required"});
  }
  if (d.status === "paused" && !d.pauseUntil) errs.push({field:"pauseUntil", code:"required"});
  if (d.status === "inactive" && !d.reconsiderOn) errs.push({field:"reconsiderOn", code:"required"});
  if (d.status === "closed" && !d.closeOutcome) errs.push({field:"closeOutcome", code:"required"});
  ["followUp","pauseUntil","reconsiderOn","checkpoint"].forEach(function(f){
    if (d[f] && !DATE_RE.test(d[f])) errs.push({field:f, code:"date"});
  });
  if (ASSESS.indexOf(d.assess) < 0) errs.push({field:"assess", code:"invalid"});
  if (TREAT.indexOf(d.prescription) < 0) errs.push({field:"prescription", code:"invalid"});
  if (d.commitment > 112) errs.push({field:"commitment", code:"range"});
  if (d.commitM !== "" && d.commitM > 450) errs.push({field:"commitM", code:"range"});
  return errs;
}

function diff(before, after){
  var out = [];
  FIELDS.forEach(function(f){
    var o = before ? before[f] : (f === "blockers" ? [] : (f === "commitment" ? 0 : ""));
    if (!same(o, after[f])) out.push({ f:f, old:o, "new":after[f] });
  });
  return out;
}
function cleanUp(list){
  /* step: where the movement sits in the plan. 0 = alongside the current movement, 1, 2… = one after another;
     movements sharing a step run in parallel. Without a step, each comes after the one before. */
  return (list || []).map(function(it){ var o = { id: it.id || uid(), text: canonField("next", it.text) }; if (it.step === +it.step && it.step >= 0) o.step = Math.floor(it.step);
      if (Array.isArray(it.after)) o.after = it.after.filter(function(x){ return typeof x === "string" && x; }).slice(0, 12);   /* which movements it follows ("cur" = the current one); [] = can start now */
      return o; })
    .filter(function(it){ return it.text; }).slice(0, 24);
}

/* create_project: the first save records an initialization movement (a baseline, not progress). */
function createProject(S, cmd, now){
  if (S.commands[cmd.id]) return { S:S, result:S.commands[cmd.id], replay:true };
  var after = canon(cmd.data);
  var errs = validate(after);
  if (errs.length) throw PMMError("invalid", errs);
  var N = clone(S), pid = cmd.projectId || uid(), mid = uid(), at = now || new Date().toISOString();
  N.projects[pid] = { id:pid, rev:1, created:at, data:after, up:cleanUp(cmd.up) };
  N.order.push(pid);
  N.movements.push({ id:mid, cmd:cmd.id, project:pid, revFrom:0, revTo:1, at:at,
    diff:diff(null, after), init:true, correction:false, prev:null });
  if (cmd.annotation) N.annotations[mid] = makeAnn(cmd.annotation, at);
  N.commands[cmd.id] = { kind:"saved", project:pid, movement:mid, rev:1 };
  return { S:N, result:N.commands[cmd.id] };
}

/* save_project_change, as in the specification. */
function saveProjectChange(S, cmd, now){
  if (S.commands[cmd.id]) return { S:S, result:S.commands[cmd.id], replay:true };
  var p = S.projects[cmd.project];
  if (!p) throw PMMError("missing");
  if (p.rev !== cmd.expectedRev) throw PMMError("stale", { current:p.rev, expected:cmd.expectedRev });
  var before = canon(p.data);
  var proposed = {}; FIELDS.forEach(function(f){ proposed[f] = p.data[f]; });
  Object.keys(cmd.edits || {}).forEach(function(f){ if (FIELDS.indexOf(f) >= 0) proposed[f] = cmd.edits[f]; });
  var after = canon(proposed);
  var errs = validate(after);
  if (errs.length) throw PMMError("invalid", errs);
  var d = diff(before, after);
  var N = clone(S), q = N.projects[cmd.project], at = now || new Date().toISOString();
  if (cmd.up) q.up = cleanUp(cmd.up);             /* the Up next list is not tracked history */
  if (!d.length){
    N.commands[cmd.id] = { kind:"no_change", project:q.id, rev:q.rev };
    return { S:N, result:N.commands[cmd.id] };
  }
  /* one progress entry for every field that changed: each gets its own revision, in field order */
  var from = q.rev, mids = [];
  q.data = after;
  d.forEach(function(x, i){
    var mid = uid();
    N.movements.push({ id:mid, cmd:cmd.id, project:q.id, revFrom:from + i, revTo:from + i + 1, at:at, diff:[x],
      init:false, correction:!!cmd.correction, prev: x.f === "next" && cmd.prev ? cmd.prev : null,
      kind: cmd.kind === "edit" || cmd.kind === "update" ? cmd.kind : null });
    mids.push(mid);
  });
  q.rev = from + d.length;
  if (cmd.annotation) N.annotations[mids[0]] = makeAnn(cmd.annotation, at);
  N.commands[cmd.id] = { kind:"saved", project:q.id, movement:mids[0], movements:mids, rev:q.rev };
  return { S:N, result:N.commands[cmd.id] };
}

/* The Up next list on its own: no revision, no movement. */
function setUpNext(S, pid, list){
  if (!S.projects[pid]) throw PMMError("missing");
  var N = clone(S); N.projects[pid].up = cleanUp(list);
  return { S:N, result:{ kind:"up_next" } };
}

/* Areas: a way to group projects. Organising, not progress: no revision, no progress entry. */
function addArea(S, cmd){
  var name = canonField("name", cmd.name || ""); if (!name) throw PMMError("invalid", [{ field:"name", code:"required" }]);
  var N = upgrade(clone(S));
  var same = N.areas.filter(function(a){ return a.name.toLowerCase() === name.toLowerCase(); })[0];
  if (same) return { S:S, result:{ kind:"exists", area:same.id } };
  var id = cmd.id || uid(); N.areas.push({ id:id, name:name });
  return { S:N, result:{ kind:"area", area:id } };
}
function renameArea(S, id, name){
  name = canonField("name", name || ""); if (!name) throw PMMError("invalid", [{ field:"name", code:"required" }]);
  var N = upgrade(clone(S)), a = N.areas.filter(function(x){ return x.id === id; })[0]; if (!a) throw PMMError("missing");
  a.name = name; return { S:N, result:{ kind:"area", area:id } };
}
function removeArea(S, id){
  var N = upgrade(clone(S)); N.areas = N.areas.filter(function(x){ return x.id !== id; });
  Object.keys(N.projects).forEach(function(pid){ var p = N.projects[pid]; if (p.areas) p.areas = p.areas.filter(function(x){ return x !== id; }); });
  return { S:N, result:{ kind:"area_removed" } };
}
function setProjectAreas(S, pid, ids){
  if (!S.projects[pid]) throw PMMError("missing");
  var N = upgrade(clone(S)), known = {}; N.areas.forEach(function(a){ known[a.id] = 1; });
  N.projects[pid].areas = (ids || []).filter(function(x, i, all){ return known[x] && all.indexOf(x) === i; });
  return { S:N, result:{ kind:"areas" } };
}
function areasOf(S, pid){ var p = S.projects[pid], ids = (p && p.areas) || []; return (S.areas || []).filter(function(a){ return ids.indexOf(a.id) >= 0; }); }

/* Record attempt: an engagement observation, never a movement. */
function recordAttempt(S, cmd, now){
  if (S.commands[cmd.id]) return { S:S, result:S.commands[cmd.id], replay:true };
  if (!S.projects[cmd.project]) throw PMMError("missing");
  var n = q4(cmd.sessions);
  if (!(n > 0) || n > 24) throw PMMError("invalid", [{ field:"sessions", code:"range" }]);
  if (!DATE_RE.test(cmd.date || "")) throw PMMError("invalid", [{ field:"date", code:"date" }]);
  var also = (cmd.also || []).filter(function(x){ return x !== cmd.project && S.projects[x]; });
  var N = clone(S), id = uid(), at = now || new Date().toISOString(), shared = also.length ? id : null;
  /* one session that served several projects: an observation for each, one use of capacity */
  [cmd.project].concat(also).forEach(function(pid, i){
    N.engagements.push({ id: i ? uid() : id, project:pid, date:cmd.date, sessions:n, estimate:!!cmd.estimate,
      note:canonField("note", cmd.note), at:at, shared:shared });
  });
  N.commands[cmd.id] = { kind:"engagement", project:cmd.project, engagement:id };
  return { S:N, result:N.commands[cmd.id] };
}

/* take back one session logged in a date range (latest first): corrects an observation, never a movement */
function removeSession(S, cmd){
  if (S.commands[cmd.id]) return { S:S, result:S.commands[cmd.id], replay:true };
  var N = clone(S), hit = null;
  for (var i = N.engagements.length - 1; i >= 0; i--){
    var e = N.engagements[i];
    if (e.project === cmd.project && e.date >= cmd.from && e.date <= cmd.to){ hit = i; break; }
  }
  if (hit == null) throw PMMError("missing");
  var e2 = N.engagements[hit];
  var take = q4(cmd.sessions) || 1;
  if (e2.sessions > take) e2.sessions = q4(e2.sessions - take); else N.engagements.splice(hit, 1);
  N.commands[cmd.id] = { kind:"session_removed", project:cmd.project };
  return { S:N, result:N.commands[cmd.id] };
}
/* remove a mistaken entry. A progress entry can only be taken back while it is the latest change to its field:
   the field returns to its earlier value and nothing new is recorded. Sessions, scheduled items and reviews just go. */
function removeEntry(S, cmd){
  if (S.commands[cmd.id]) return { S:S, result:S.commands[cmd.id], replay:true };
  var N = upgrade(clone(S)), k = cmd.kind, id = cmd.target, i, res = { kind:"removed", what:k };
  function idx(list){ for (var j = 0; j < list.length; j++) if (list[j].id === id) return j; return -1; }
  if (k === "session"){ i = idx(N.engagements); if (i < 0) throw PMMError("missing"); N.engagements.splice(i, 1); }
  else if (k === "scheduled"){ i = idx(N.scheduled); if (i < 0) throw PMMError("missing"); N.scheduled.splice(i, 1); }
  else if (k === "review"){
    i = idx(N.reviews); if (i < 0) throw PMMError("missing");
    var rv = N.reviews[i], gone = {}; (rv.assessments || []).forEach(function(a){ gone[a] = 1; });
    N.assessments = N.assessments.filter(function(a){ return !gone[a.id]; });
    N.reviews.splice(i, 1);
  }
  else if (k === "movement"){
    i = idx(N.movements); if (i < 0) throw PMMError("missing");
    var m = N.movements[i], q = N.projects[m.project];
    if (m.init || !q) throw PMMError("invalid", [{ field:"entry", code:"init" }]);
    var x = m.diff[0], f = x.f;
    var later = N.movements.some(function(y, j){ return j !== i && y.project === m.project && !y.init && y.at >= m.at && y.revFrom >= m.revTo && y.diff.some(function(z){ return z.f === f; }); });
    if (later) throw PMMError("invalid", [{ field:"entry", code:"later" }]);
    var proposed = {}; FIELDS.forEach(function(g){ proposed[g] = q.data[g]; });
    proposed[f] = x.old;
    var after = canon(proposed), errs = validate(after);
    if (errs.length) throw PMMError("invalid", [{ field:"entry", code:"incomplete" }]);
    q.data = after; q.rev += 1;
    if (f === "next"){
      var up = (q.up || []).filter(function(it){ return it.text !== x.old; });
      if (x["new"] && !up.some(function(it){ return it.text === x["new"]; })) up.unshift({ id:uid(), text:x["new"] });
      q.up = cleanUp(up);
    }
    N.movements.splice(i, 1);
    delete N.annotations[id];
    (N.plans || []).forEach(function(p){ if (p.movements) p.movements = p.movements.filter(function(z){ return z !== id; }); });
    (N.reviews || []).forEach(function(r){ if (r.movements) r.movements = r.movements.filter(function(z){ return z !== id; }); });
    res.field = f; res.project = q.id;
  }
  else throw PMMError("invalid", [{ field:"kind", code:"invalid" }]);
  N.commands[cmd.id] = res;
  return { S:N, result:res };
}
/* ---- managing projects: none of these record progress ---- */
function deleteProject(S, cmd){
  if (S.commands[cmd.id]) return { S:S, result:S.commands[cmd.id], replay:true };
  var N = upgrade(clone(S)), pid = cmd.project;
  if (!N.projects[pid]) throw PMMError("missing");
  var gone = {};
  N.movements = N.movements.filter(function(m){ if (m.project === pid){ gone[m.id] = 1; return false; } return true; });
  Object.keys(gone).forEach(function(id){ delete N.annotations[id]; });
  N.engagements = N.engagements.filter(function(e){ return e.project !== pid; });
  N.scheduled = N.scheduled.filter(function(x){ return x.project !== pid; });
  var ga = {}; N.assessments = N.assessments.filter(function(a){ if (a.project === pid){ ga[a.id] = 1; return false; } return true; });
  (N.plans || []).forEach(function(p){ if (p.movements) p.movements = p.movements.filter(function(z){ return !gone[z]; }); });
  (N.reviews || []).forEach(function(r){
    if (r.movements) r.movements = r.movements.filter(function(z){ return !gone[z]; });
    if (r.judgements) r.judgements = r.judgements.filter(function(j){ return j.project !== pid; });
    if (r.assessments) r.assessments = r.assessments.filter(function(a){ return !ga[a]; });
  });
  [N.cpNotes, N.mvNotes].forEach(function(o){ Object.keys(o).forEach(function(k){ if (k.indexOf(pid + "|") === 0) delete o[k]; }); });
  delete N.projects[pid];
  N.order = N.order.filter(function(x){ return x !== pid; });
  N.commands[cmd.id] = { kind:"deleted", project:pid };
  return { S:N, result:N.commands[cmd.id] };
}
function setPinned(S, pid, on){
  if (!S.projects[pid]) throw PMMError("missing");
  var N = clone(S); if (on) N.projects[pid].pinned = true; else delete N.projects[pid].pinned;
  return { S:N, result:{ kind:"pinned", project:pid } };
}
function moveProject(S, pid, delta){
  var i = S.order.indexOf(pid); if (i < 0) throw PMMError("missing");
  var j = Math.max(0, Math.min(S.order.length - 1, i + delta)); if (j === i) return { S:S, result:{ kind:"no_change" } };
  var N = clone(S); N.order.splice(i, 1); N.order.splice(j, 0, pid);
  return { S:N, result:{ kind:"moved", project:pid } };
}
/* a copy starts fresh: same goal, treatment, hours, tasks and areas; its own baseline, no history */
function duplicateProject(S, cmd, now){
  if (S.commands[cmd.id]) return { S:S, result:S.commands[cmd.id], replay:true };
  var p = S.projects[cmd.project]; if (!p) throw PMMError("missing");
  var d = clone(p.data); d.name = canonField("name", cmd.name || (d.name + " (2)"));
  d.assess = ""; d.assessWhy = ""; if (d.status === "closed"){ d.status = "active"; d.closeOutcome = ""; }
  var r = createProject(S, { id:cmd.id, data:d, up:(p.up || []).map(function(it){ return { text:it.text, step:it.step }; }) }, now);
  if (p.areas && p.areas.length) r.S.projects[r.result.project].areas = p.areas.slice();
  var at = r.S.order.indexOf(r.result.project), src = r.S.order.indexOf(p.id);
  r.S.order.splice(at, 1); r.S.order.splice(src + 1, 0, r.result.project);
  return r;
}
/* a scheduled session: logged ahead, counted only once you confirm it happened */
function scheduleSession(S, cmd, now){
  if (S.commands[cmd.id]) return { S:S, result:S.commands[cmd.id], replay:true };
  if (!S.projects[cmd.project]) throw PMMError("missing");
  var ev = !!cmd.event, n = ev ? 0 : q4(cmd.sessions);
  if (!ev && (!(n > 0) || n > 24)) throw PMMError("invalid", [{ field:"sessions", code:"range" }]);
  if (!DATE_RE.test(cmd.date || "")) throw PMMError("invalid", [{ field:"date", code:"date" }]);
  var N = upgrade(clone(S)), id = uid();
  N.scheduled.push({ id:id, project:cmd.project, date:cmd.date, time:canonField("time", cmd.time), sessions:n, note:canonField("note", cmd.note), at:now || new Date().toISOString() });
  if (ev) N.scheduled[N.scheduled.length - 1].event = true;
  if (cmd.weekly) N.scheduled[N.scheduled.length - 1].weekly = true;
  N.commands[cmd.id] = { kind:"scheduled", scheduled:id };
  return { S:N, result:N.commands[cmd.id] };
}
/* settle a scheduled session: done becomes a logged session on the day it happened; otherwise it is dropped or moved */
function settleScheduled(S, cmd, now){
  if (S.commands[cmd.id]) return { S:S, result:S.commands[cmd.id], replay:true };
  var N = upgrade(clone(S)), i = -1;
  N.scheduled.forEach(function(x, j){ if (x.id === cmd.scheduled) i = j; });
  if (i < 0) throw PMMError("missing");
  var sc = N.scheduled[i], out = cmd.outcome;
  if (out === "stop"){ N.scheduled.splice(i, 1); }
  else if (sc.weekly && out !== "move"){
    /* a weekly item: settle this week's one, then it comes back a week later */
    var d0 = cmd.date && DATE_RE.test(cmd.date) ? cmd.date : sc.date;
    if (out === "done" && sc.event) N.scheduled.push({ id:uid(), project:sc.project, date:d0, time:sc.time, sessions:0, note:sc.note, at:now || new Date().toISOString(), event:true, done:d0, from:sc.id });
    else if (out === "done") N.engagements.push({ id:uid(), project:sc.project, date:d0, sessions:sc.sessions, estimate:false, note:sc.note, at:now || new Date().toISOString(), shared:null, scheduled:sc.id });
    var nd = parse(sc.date); nd.setDate(nd.getDate() + 7); sc.date = iso(nd);
  }
  else if (out === "move"){
    if (!DATE_RE.test(cmd.date || "")) throw PMMError("invalid", [{ field:"date", code:"date" }]);
    sc.date = cmd.date; if (cmd.time != null) sc.time = canonField("time", cmd.time);
  } else if (sc.event && out === "done"){
    /* an event is not a session: it is ticked off and kept, never counted */
    sc.done = cmd.date && DATE_RE.test(cmd.date) ? cmd.date : sc.date;
  } else {
    N.scheduled.splice(i, 1);
    if (out === "done"){
      var day = cmd.date && DATE_RE.test(cmd.date) ? cmd.date : sc.date;
      N.engagements.push({ id:uid(), project:sc.project, date:day, sessions:sc.sessions, estimate:false, note:sc.note, at:now || new Date().toISOString(), shared:null, scheduled:sc.id });
    }
  }
  N.commands[cmd.id] = { kind:"settled", outcome:out, project:sc.project };
  return { S:N, result:N.commands[cmd.id] };
}
function dueScheduled(S, todayIso){ return (S.scheduled || []).filter(function(x){ return !x.done && x.date <= todayIso && S.projects[x.project]; }); }
/* annotate_movement: enriches the movement, keeps its own edit history, never creates a movement. */
var ANN = ["explanation","reflection","evidence","occurred","magnitude","direction"];
var MAG = ["","minor","moderate","major"], DIR = ["","forward","setback","neutral"];
function makeAnn(a, at){
  var o = { history:[], updated:at };
  ANN.forEach(function(k){ o[k] = canonField(k, a[k]); });
  return o;
}
function annotate(S, mid, a, now){
  if (!S.movements.some(function(m){ return m.id === mid; })) throw PMMError("missing");
  if (a.occurred && !DATE_RE.test(a.occurred)) throw PMMError("invalid", [{ field:"occurred", code:"date" }]);
  if (a.magnitude && MAG.indexOf(a.magnitude) < 0) throw PMMError("invalid", [{ field:"magnitude", code:"invalid" }]);
  if (a.direction && DIR.indexOf(a.direction) < 0) throw PMMError("invalid", [{ field:"direction", code:"invalid" }]);
  var N = clone(S), at = now || new Date().toISOString(), cur = N.annotations[mid];
  var next = makeAnn(a, at);
  if (cur){
    var prev = {}; ANN.forEach(function(k){ prev[k] = cur[k]; });
    var changed = ANN.some(function(k){ return prev[k] !== next[k]; });
    if (!changed) return { S:S, result:{ kind:"no_change" } };
    next.history = cur.history.concat([{ at:cur.updated, value:prev }]);
  }
  N.annotations[mid] = next;
  return { S:N, result:{ kind:"annotated", movement:mid } };
}

/* a note and a significance on any timeline entry that is not a progress entry: a session, a scheduled
   session or event, or a check date. Never touches the project, never creates a progress entry. */
function noteEntry(S, cmd){

/* a suggestion the review logic would make, shown on the card with one tap to apply */
function pfSuggest(p){
  var d = p.data; if (d.status !== "active") return null;
  var since = addDays(todayISO(), -14), a = null;
  (S().assessments || []).forEach(function(x){ if (x.project === p.id && x.to >= since && (!a || x.at > a.at)) a = x; });
  if (!a || typeof periodFacts !== "function") return null;
  var q = quad(a.progress, periodFacts(p, a.from, a.to));
  if (q !== "lb") return null;
  var n = Math.max(pmode() === "month" ? 4 : 1, planOf(p));
  if (d.prescription === "protected" && planOf(p) >= n) return null;
  var ap = { prescription:"protected" }; if (planOf(p) !== n) ap[PK()] = n;
  return { k:"sg_protect", n:n, apply:ap };
}
function pfSugLine(p){
  var sg = pfSuggest(p); if (!sg) return "";
  return '<div class="sugline pfsug"><span><b>' + esc(t("suggested")) + ":</b> " + esc(t(sg.k, { n:sg.n })) + '</span><button class="btn sm ti" type="button" data-act="pfsug" data-id="' + esc(p.id) + '">' + esc(t("apply")) + "</button></div>";
}
function applyPfSug(pid){
  var p = S().projects[pid], sg = p && pfSuggest(p); if (!sg) return;
  var r = attempt(function(s){ return PMM.saveProjectChange(s, { id:PMM.uid(), project:pid, expectedRev:p.rev, edits:sg.apply }); });
  if (!r.ok){ return toast(r.error.code === "stale" ? t("cfTitle") : t("errSave")); }
  render();
  if (r.result.kind === "saved"){ var mid = r.result.movement, nm = r.result.movements.length; toast(nm === 1 ? t("saved") : t("savedN", { n:nm }), t("addExpl"), function(){ openAnnotate(mid); }); }
}
/* in-table editing: every change updates the draft and the capacity panel without redrawing the page */
function wireAttention(){
  if (ui.tab !== "portfolio" || !ui.att.edit) return;
  wireSteppers(main); wireSwitches(main);
  var sw = main.querySelector('[data-sw="capdef"]'); if (sw) sw.addEventListener("click", function(){ setTimeout(readPlanDom, 0); });
  readPlanDom();
}
function readPlanDom(){
  if (ui.tab !== "portfolio" || !ui.att.edit) return null;
  var w = ui.att.week, d = planFor(w), total = 0;
  delete d.fresh;
  var capEl = main.querySelector('[data-plan="cap"] input'); if (capEl) d.capacity = PMM.q4(capEl.value);
  var sw = main.querySelector('[data-sw="capdef"]'); if (sw) d.asDefault = sw.getAttribute("aria-checked") === "true";
  activeProjects().forEach(function(p){
    var row = d.rows[p.id] || (d.rows[p.id] = { commitment:planOf(p), prescription:p.data.prescription });
    var c = main.querySelector('[data-plan="c"][data-pid="' + p.id + '"] input'), pr = main.querySelector('select[data-plan="pr"][data-pid="' + p.id + '"]');
    if (c) row.commitment = PMM.q4(c.value);
    if (pr) row.prescription = pr.value;
    total += row.commitment;
  });
  d.total = total; d.at = new Date().toISOString();
  var note = document.getElementById("rvNote"); if (note && ui.rv){ ui.rv.note = note.value; saveRv(); }
  var over = total > d.capacity;
  var chip = document.getElementById("fitChip"); if (chip){ chip.className = "chip sm " + (over ? "cu" : "tk"); chip.textContent = over ? t("overBy", { n:total - d.capacity }) : t("fits"); }
  var cn = document.getElementById("commitN"); if (cn) cn.textContent = nf(total);
  var cb = document.getElementById("capBar"); if (cb) cb.innerHTML = capBar(d.capacity, total, PMM.capacityUsed(S(), PMM.parse(w), perDays()));
  var on = document.getElementById("overNote"); if (on) on.hidden = !over;
  var btn = document.getElementById("commitBtn"); if (btn) btn.disabled = over;
  putPlanDraft(d);
  return d;
}
document.addEventListener("input", function(e){ if (e.target.closest && e.target.closest("[data-plan]") && !e.target.closest(".sheet")) readPlanDom(); });
document.addEventListener("change", function(e){ if (e.target.closest && e.target.closest("[data-plan]") && !e.target.closest(".sheet")) readPlanDom(); });
function planChanges(d){
  var out = [];
  activeProjects().forEach(function(p){
    var r = d.rows[p.id]; if (!r) return;
    var e = {};
    if (r.commitment !== planOf(p) || (pmode() === "month" && p.data.commitM === "" && r.commitment)) e[PK()] = r.commitment;
    if (r.prescription !== p.data.prescription) e.prescription = r.prescription;
    out.push({ project:p.id, expectedRev:p.rev, edits:e });
  });
  return out;
}
function reviewPlan(){
  var d = readPlanDom(); if (!d || d.total > d.capacity) return;
  var changes = planChanges(d), cmd = { id:PMM.uid(), week:d.week, mode:pmode(), capacity:d.capacity, changes:changes };
  var dry;
  try { dry = PMM.commitPlan(S(), cmd); } catch (e){ if (e.code === "stale") return toast(t("cfTitle")); return toast(t("errSave")); }
  ui.planPending = { cmd:cmd, asDefault:d.asDefault };
  var ms = dry.S.movements.filter(function(m){ return m.plan === cmd.id; });
  var body = ms.length ? ms.map(function(m){ return '<div class="card" style="margin-top:6px"><span class="lab">' + esc(S().projects[m.project].data.name) + '</span><ul class="diff">' + m.diff.map(diffRow).join("") + "</ul></div>"; }).join("")
    : '<p style="margin:0">' + esc(t("planNoChange")) + "</p>";
  var c0 = PMM.capacityForPeriod(S(), d.week, pmode());
  if (d.capacity !== c0) body += '<p class="note">' + esc(t("capChanged", { a:c0, b:d.capacity })) + "</p>";
  openSheet(ms.length ? t(ms.length === 1 ? "planOne" : "planN", { n:ms.length }) : t("planRecordOnly"), body,
    '<button class="btn ti" type="button" data-act="closesheet">' + esc(t("backEdit")) + '</button><button class="btn tk" type="button" data-act="plancommit">' + esc(t("commitPlan")) + "</button>");
}
function commitPlanNow(){
  var pp = ui.planPending; if (!pp) return;
  var r = attempt(function(s){
    var x = PMM.commitPlan(s, pp.cmd);
    if (pp.asDefault) x = { S:PMM.setCapacity(x.S, pp.cmd.week, pp.cmd.capacity, true, pp.cmd.mode).S, result:x.result };
    return x;
  });
  if (!r.ok){ closeSheet(); return toast(r.error.code === "stale" ? t("cfTitle") : r.error.code === "over_capacity" ? t("overHint") : t("errSave")); }
  dropPlanDraft(); ui.planPending = null; ui.att.edit = false; closeSheet(); render();
  var n = r.result.movements.length;
  toast(n ? t(n === 1 ? "planDone1" : "planDoneN", { n:n }) : t("planDone0"));
}

  var r = d > 0
    ? attempt(function(s){ return PMM.recordAttempt(s, { id:PMM.uid(), project:pid, date:w === cur ? todayISO() : perEnd(w), sessions:logDef() }); })
    : attempt(function(s){ return PMM.removeSession(s, { id:PMM.uid(), project:pid, from:w, to:perEnd(w), sessions:logDef() }); });

    var days = Math.min(span, PMM.daysBetween(PMM.parse(w > from ? w : from), PMM.parse(end)) + 1);
    committed += c ? Math.round(c * days / span) : 0;

function trendData(n){
  var s = S(), cur = wkISO(new Date()), weeks = [], month = pmode() === "month";
  for (var i = n - 1; i >= 0; i--) weeks.push(addDays(cur, -7 * i));
  var ps = s.order.map(function(id){ return s.projects[id]; });
  var rows = ps.map(function(p){
    var c = weeks.map(function(w, i){
      var end = addDays(w, 6);
      if (i === n - 1) return p.data.status === "active" || p.data.status === "waiting" ? (month ? (PMM.plannedOf(p.data, "month") || 0) / 4 : p.data.commitment || 0) : 0;
      var v = month ? (PMM.committedAtM(s, p.id, end) || 0) / 4 : PMM.committedAt(s, p.id, end);
      return v || 0;
    });
    var e = weeks.map(function(w){ return PMM.engagedIn(s, p.id, w, 7); });
    return { p:p, c:c, e:e };
  }).filter(function(r){ return r.c.some(Boolean) || r.e.some(Boolean); });

    if (e[i]) svg += '<rect class="te' + (cur ? " cur" : "") + '" x="' + (x + (big ? 3 : 1.5)) + '" y="' + y(e[i]).toFixed(1) + '" width="' + (bw - (big ? 6 : 3)) + '" height="' + (H - y(e[i])).toFixed(1) + '" rx="' + (big ? 4 : 2) + '"/>';

/* ---------- safety: account sync, backups and local snapshots ----------
   The device keeps a full copy (instant, offline). When the page runs in Claude, a private copy is also
   kept in the person's own space of this artifact's store (data/users/<id>/), which nobody else can read.
   Every commit is still one local write first; the account copy follows a moment later. */
var SYNC_META = "promove.sync.v1", SNAPS = "promove.snaps.v1", CHUNK = 60000;
var sync = { db:null, uid:null, state:"off", lastAt:null, err:null, timer:0, busy:false, unsub:null, remote:0 };
var syncMeta = (function(){ try { return JSON.parse(lsGet(SYNC_META) || "null") || { base:0, dirty:false, lastAt:null }; } catch (e){ return { base:0, dirty:false, lastAt:null }; } })();
if (!syncMeta.dev){ syncMeta.dev = "d-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); lsSet(SYNC_META, JSON.stringify(syncMeta)); }
/* a version this device wrote itself is never "another device" — even when the listener sees it before the write call returns */
function ownHead(h){ var d = h.exists ? h.data() : null; return !!(d && (d.by === syncMeta.dev || (sync.pending && d.version === sync.pending))); }
function saveSyncMeta(){ lsSet(SYNC_META, JSON.stringify(syncMeta)); }
function headRef(){ return sync.db.doc("data/users/" + sync.uid + "/promove"); }
function setSync(st, err){ sync.state = st; sync.err = err || null; var el = document.getElementById("syncLine"); if (el) el.innerHTML = syncLineHTML(); }

/* --- local snapshots: one per day, taken before the day's first change, and before any restore or erase --- */
function getSnaps(){ try { return JSON.parse(lsGet(SNAPS) || "[]"); } catch (e){ return []; } }
function takeSnapshot(reason, force){
  if (!storageOK) return;
  var day = todayISO();
  if (!force && sync.snapDay === day) return;
  var list = getSnaps();
  if (!force && list.some(function(x){ return x.day === day && x.reason === "daily"; })){ sync.snapDay = day; return; }
  if (!force) sync.snapDay = day;
  if (!S().order.length && !S().movements.length) return;
  list.unshift({ day:day, at:new Date().toISOString(), reason:reason, data:S() });
  list = list.slice(0, 8);
  while (list.length){
    try { localStorage.setItem(SNAPS, JSON.stringify(list)); return; } catch (e){ list.pop(); }
  }
}

/* --- account sync --- */
function startSync(){
  if (!(window.claude && typeof window.claude.use === "function")) return;
  setSync("connecting");
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db = r[0], user = r[1];
    if (!db || !user) return setSync("off");
    return user.id().then(function(id){
      if (!id) return setSync("off");
      sync.db = db; sync.uid = id;
      return headRef().get().then(function(h){ onRemote(h, true); subscribe(); });
    });
  }).catch(function(e){ setSync("error", e && e.code); });
}
function subscribe(){
  if (sync.unsub) return;
  sync.unsub = headRef().onSnapshot(function(h){ onRemote(h, false); }, function(e){ sync.unsub = null; setSync("error", e && e.code); });
}
function onRemote(h, first){
  var rv = h.exists ? (h.data().version || 0) : 0;
  sync.remote = rv;
  if (!h.exists){
    if (S().order.length || S().movements.length){ syncMeta.dirty = true; saveSyncMeta(); pushSoon(0); }
    else setSync("synced");
    return;
  }
  if (ownHead(h)){ if (rv > syncMeta.base && !sync.busy){ syncMeta.base = rv; saveSyncMeta(); } if (syncMeta.dirty) pushSoon(1500); else { sync.lastAt = h.data().at; setSync("synced"); } return; }
  if (rv <= syncMeta.base){ if (syncMeta.dirty) pushSoon(first ? 0 : 1500); else { sync.lastAt = h.data().at; setSync("synced"); } return; }
  /* the account has a newer version than this device last saw */
  if (!syncMeta.dirty) return pull(h);
  conflict(h);
}
function fetchRemote(h){
  var hd = h.data(), n = hd.chunks || 0, parts = [], i = 0;
  function next(){
    if (i >= n){ return PMM.upgrade(JSON.parse(parts.join(""))); }
    return headRef().collection("chunks").doc("v" + hd.version + "-" + i).get().then(function(c){
      if (!c.exists) throw { code:"incomplete" };
      parts.push(c.data().text); i++; return next();
    });
  }
  return Promise.resolve().then(next);
}
function pull(h){
  var hd = h.data();
  setSync("connecting");
  return fetchRemote(h).then(function(data){
    takeSnapshot("before-sync", true);
    store.S = data; lsSet(KEY, JSON.stringify(store.S));
    syncMeta.base = hd.version; syncMeta.dirty = false; syncMeta.lastAt = hd.at; saveSyncMeta();
    sync.lastAt = hd.at; setSync("synced"); render();
  }).catch(function(e){ setSync("error", e && e.code); });
}
function pushSoon(ms){ clearTimeout(sync.timer); sync.timer = setTimeout(push, ms == null ? 1500 : ms); }
function push(){
  if (!sync.db || sync.busy) return;
  if (!syncMeta.dirty) return;
  sync.busy = true; setSync("saving");
  var ref = headRef();
  ref.get().then(function(h){
    var rv = h.exists ? (h.data().version || 0) : 0;
    if (rv > syncMeta.base && !ownHead(h)){ sync.busy = false; return conflict(h); }
    syncMeta.dirty = false;   /* changes made from here on mark it dirty again and get their own push */
    var version = rv + 1, text = JSON.stringify(S()), n = Math.max(1, Math.ceil(text.length / CHUNK)), i = 0;
    function writeChunk(){
      if (i >= n){ sync.pending = version; return ref.set({ version:version, chunks:n, at:new Date().toISOString(), size:text.length, by:syncMeta.dev }); }
      return ref.collection("chunks").doc("v" + version + "-" + i).set({ text:text.slice(i * CHUNK, (i + 1) * CHUNK) }).then(function(){ i++; return writeChunk(); });
    }
    return writeChunk().then(function(){
      var old = h.exists ? h.data() : null;
      syncMeta.base = version; syncMeta.lastAt = new Date().toISOString(); saveSyncMeta(); sync.pending = 0;
      sync.lastAt = syncMeta.lastAt; sync.busy = false; setSync(syncMeta.dirty ? "saving" : "synced");
      if (old) for (var k = 0; k < (old.chunks || 0); k++) ref.collection("chunks").doc("v" + old.version + "-" + k).delete().catch(function(){});
      if (syncMeta.dirty) pushSoon();
    });
  }).catch(function(e){ sync.busy = false; sync.pending = 0; syncMeta.dirty = true; saveSyncMeta(); setSync("error", e && e.code); if (e && e.code === "unavailable") pushSoon(4000 + Math.random() * 3000); });
}
/* both this device and another changed since they last agreed: nothing is merged silently */
function conflict(h){
  if (ownHead(h)) return;
  setSync("conflict");
  if (ui.conflictHead && scrim.querySelector('[data-act="symine"]')){ ui.conflictHead = h; return; }
  ui.conflictHead = h;
  openSheet(t("syConflictT"), '<p style="margin:0">' + esc(t("syConflictB", { d:fmtDT(h.data().at) })) + '</p><p class="note">' + esc(t("syConflictN")) + "</p>",
    '<button class="btn ti" type="button" data-act="sytheirs">' + esc(t("syTheirs")) + '</button><button class="btn tk" type="button" data-act="symine">' + esc(t("syMine")) + "</button>");
}
function resolveConflict(mine){
  var h = ui.conflictHead; closeSheet(); if (!h) return;
  if (mine){
    /* keep the other device's version on this device before replacing it in the account */
    fetchRemote(h).then(function(other){
      var list = getSnaps(); list.unshift({ day:todayISO(), at:h.data().at, reason:"other-device", data:other });
      try { localStorage.setItem(SNAPS, JSON.stringify(list.slice(0, 8))); } catch (e){}
    }).catch(function(){}).then(function(){ syncMeta.base = h.data().version; syncMeta.dirty = true; saveSyncMeta(); pushSoon(0); });
  }
  else { syncMeta.dirty = false; saveSyncMeta(); pull(h); }
}
function markDirty(){ syncMeta.dirty = true; saveSyncMeta(); if (sync.db) pushSoon(); }
function syncLineHTML(){
  var st = sync.state;
  var txt = st === "synced" ? t("sySynced", { t:sync.lastAt ? fmtDT(sync.lastAt) : "" }) : st === "saving" ? t("sySaving") : st === "connecting" ? t("syConnecting") :
    st === "conflict" ? t("syConflictS") : st === "error" ? t("syError") : storageOK ? t("syLocal") : t("noStore");
  return '<span class="sydot ' + st + '"></span><span>' + esc(txt) + "</span>";
}

/* --- backup files --- */
function backupText(){ return JSON.stringify({ app:"Promove", format:1, exportedAt:new Date().toISOString(), data:S() }, null, 1); }
function downloadBackup(){
  var name = "promove-backup-" + todayISO() + ".json", text = backupText();
  if (typeof nativeBackup === "function" && NATIVE && nativeBackup(name, text)) return;
  var fallback = function(){
    try {
      var url = URL.createObjectURL(new Blob([text], { type:"application/json" })), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast(t("bkSaved"));
    } catch (e){ toast(t("bkFailed")); }
  };
  var use = window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null);
  use.then(function(dl){
    if (!dl) return fallback();
    return dl.save({ filename:name, data:text }).then(function(r){ if (r && r.status === "saved") toast(t("bkSaved")); }, function(e){
      if (e && e.code === "declined") return;
      if (e && (e.code === "unavailable" || e.code === "not_granted" || e.code === "capability_disabled" || e.code === "capability_removed")) return fallback();
      toast(t("bkFailed"));
    });
  }).catch(fallback);
}
function validBackup(o){
  var d = o && o.data ? o.data : o;
  if (!d || typeof d !== "object" || !d.projects || typeof d.projects !== "object" || !Array.isArray(d.order) || !Array.isArray(d.movements)) return null;
  if (!d.order.every(function(id){ return d.projects[id] && d.projects[id].data; })) return null;
  return PMM.upgrade(JSON.parse(JSON.stringify(d)));
}
function pickBackup(){
  var inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      var o = null; try { o = JSON.parse(rd.result); } catch (e){}
      var d = validBackup(o);
      if (!d) return toast(t("bkInvalid"));
      previewRestore(d, o.exportedAt || null, "file");
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------- in-app reminders: what fell due, shown once when the app opens ----------
   A reminder names its obligation, so the same one is never repeated, and dismissing it assesses
   nothing: the flag stays on Portfolio until the obligation itself is dealt with. */
var REM = "promove.reminded.v1";
function remKey(code, pid, date){ return code + ":" + (pid || "") + ":" + (date || ""); }
function dueReminders(all){
  var s = S(), F = PMM.flags(s, new Date(), wkStart()), out = [];
  if (F.portfolio.reviewDue) out.push({ key:remKey("review", "", F.portfolio.reviewDue.since), text:t("fl_review_due"), act:'data-act="gotab" data-tab="review"' });
  if (F.portfolio.capacityConflict) out.push({ key:remKey("capacity", "", wkISO(new Date()) + "-" + F.portfolio.capacityConflict.total), text:t("fl_capacity", { n:F.portfolio.capacityConflict.total - F.portfolio.capacityConflict.capacity }), act:'data-act="planedit"' });
  s.order.forEach(function(pid){
    F.projects[pid].forEach(function(f){
      if (f.code === "engagement_unassessed") return;
      out.push({ key:remKey(f.code, pid, f.date || f.week), text:t("fl_" + f.code + (f.per ? "_" + f.per : ""), { a:f.actual, b:f.agreed }) + " · " + s.projects[pid].data.name, act:'data-act="open" data-id="' + esc(pid) + '"' + (f.code === "checkpoint_due" ? ' data-pv="since"' : "") });
    });
  });
  /* end of the day with nothing logged: a gentle nudge, once */
  var td = todayISO();
  if (new Date().getHours() >= 18 && !prefs.timer && s.order.some(function(pid){ return s.projects[pid].data.status === "active"; }) && !s.engagements.some(function(e){ return e.date === td; }))
    out.push({ key:remKey("nolog", "", td), text:t("noLogToday"), act:'data-act="logsheet"' });
  var seen = {}; try { seen = JSON.parse(lsGet(REM) || "{}"); } catch (e){}
  return all ? out : out.filter(function(r){ return !seen[r.key]; });
}
function showReminders(){
  if (prefs.reminders === false || !S().order.length) return;
  var list = dueReminders(); if (!list.length) return;
  var body = '<p class="note" style="margin:0 0 8px">' + esc(t("remIntro")) + '</p><ul class="picklist">' + list.map(function(r){
    return '<li><button type="button" ' + r.act + '><span class="remdot" aria-hidden="true"></span><span>' + esc(r.text) + "</span></button></li>"; }).join("") + "</ul>";
  ui.remShown = list.map(function(r){ return r.key; });
  openSheet(t("remTitle"), body, '<button class="btn tk" type="button" data-act="remok">' + esc(t("remOk")) + "</button>");
}
function markReminded(){
  var seen = {}; try { seen = JSON.parse(lsGet(REM) || "{}"); } catch (e){}
  (ui.remShown || []).forEach(function(k){ seen[k] = todayISO(); });
  var keys = Object.keys(seen); if (keys.length > 300) keys.slice(0, keys.length - 300).forEach(function(k){ delete seen[k]; });
  lsSet(REM, JSON.stringify(seen)); ui.remShown = null;
}

/* ---------- the Android app (Capacitor): phone notifications, back button, backups as files ----------
   Everything here is inert in a browser: it only runs when the page is inside the native app. */
var NATIVE = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform());
function nPlug(name){ return NATIVE && window.Capacitor.Plugins ? window.Capacitor.Plugins[name] : null; }
if (NATIVE) document.documentElement.classList.add("native");

/* stable numeric ids per item, so rescheduling replaces rather than duplicates */
function nId(key){ var h = 0; for (var i = 0; i < key.length; i++){ h = ((h << 5) - h + key.charCodeAt(i)) | 0; } return Math.abs(h % 2000000000) + 10; }
function atLocal(iso, hm){ var d = PMM.parse(iso), p = (hm || "09:00").split(":"); d.setHours(+p[0] || 0, +p[1] || 0, 0, 0); return d; }

/* what the phone should announce: due items on their day, scheduled sessions at their time */
function nPlan(){
  var s = S(), out = [], now = Date.now(), horizon = now + 21 * 864e5, c = nCfg();
  function add(key, when, title, body, extra){ var ts = when.getTime(); if (ts > now + 30000 && ts < horizon) out.push({ id:nId(key), title:title, body:body, schedule:{ at:when, allowWhileIdle:true }, extra:extra || {} }); }
  function pn(pid){ return s.projects[pid] ? s.projects[pid].data.name : ""; }
  if (c.sch) (s.scheduled || []).forEach(function(x){
    if (x.done || !s.projects[x.project]) return;

/* ---------- edit flow: draft → preview → one commit ---------- */
function draftKey(pid){ return DRAFT + pid; }
/* drafts are not commits: kept per project, in storage when available and in memory otherwise */
var memDraft = {};
function getDraft(pid){ var s = lsGet(draftKey(pid)); if (s) try { return JSON.parse(s); } catch (e){} return memDraft[pid] || null; }
function putDraft(pid, d){ memDraft[pid] = d; lsSet(draftKey(pid), JSON.stringify(d)); }
function dropDraft(pid){ delete memDraft[pid]; lsDel(draftKey(pid)); }
function openEdit(mode, focusName, presetPrev){
  var p = proj(); if (!p) return;
  if (presetPrev) ui.presetPrev = presetPrev;
  var dr = getDraft(p.id);
  var base = dr ? Object.assign({}, p.data, dr.edits) : p.data;
  var note = dr ? '<p class="banner ti" style="margin:6px 0 0">' + esc(t("draftRestored", { t:fmtDT(dr.at) })) + "</p>" : "";
  var foot = (dr ? '<button class="btn ti" type="button" data-act="discard">' + esc(t("discard")) + "</button>" : "") +
    '<button class="btn tk" type="button" data-act="preview">' + esc(t("reviewChanges")) + "</button>";
  /* base = the saved values the editor started from; only fields that differ from it are sent,
     so re-applying after a conflict never reverts someone else's change */
  ui.edit = { pid:p.id, mode:mode === "update" ? "update" : "edit", baseRev: dr ? dr.baseRev : p.rev, base: dr && dr.base ? dr.base : PMM.canon(p.data) };
  openSheet(t(mode === "update" ? "updateTitle" : "editTitle") + (mode === "update" ? " · " + p.data.name : ""), note + projectForm(base, ui.edit.mode, p.data.next), foot, function(sh){
    var form = sh.querySelector("form");
    syncWhen(form); wireSteppers(sh); wireSegs(sh);
    var ps = sh.querySelector('[data-seg="prev"]');
    if (ps) ps.addEventListener("click", function(){ setTimeout(function(){ ui.presetPrev = segVal(sh, "prev") || null; }, 0); });
    form.addEventListener("change", function(e){ if (e.target.name === "status") syncWhen(form); });
    form.addEventListener("input", function(){
      putDraft(p.id, { baseRev:ui.edit.baseRev, base:ui.edit.base, at:new Date().toISOString(), edits:readForm(form) });
    });
    var target = focusName && form.elements[focusName];
    if (target) setTimeout(function(){ target.focus(); if (target.setSelectionRange && target.type !== "date") try { target.setSelectionRange(target.value.length, target.value.length); } catch (e){} }, 60);
  });
}
function previewFromEdit(){
  var form = ui.edit && ui.edit.inline ? document.getElementById("pform") : scrim.querySelector('form[data-form="project"]'); if (!form) return;
  var p = S().projects[ui.edit.pid], all = PMM.canon(readForm(form)), base = ui.edit.base, edits = {};
  PMM.FIELDS.forEach(function(f){ if (form.elements[f] && JSON.stringify(all[f]) !== JSON.stringify(base[f])) edits[f] = all[f]; });
  var proposed = PMM.canon(Object.assign({}, p.data, edits)), errs = PMM.validate(proposed);
  if (errs.length){
    var hidden = errs.filter(function(e){ return !form.elements[e.field]; });
