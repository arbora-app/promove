    showErrors(form, errs); return;
  }
  openPreview({ id:PMM.uid(), project:p.id, expectedRev:ui.edit.baseRev, edits:edits, kind:ui.edit.mode }, { fromEdit:true, inline:!!ui.edit.inline, fromUpdate:ui.edit.mode === "update" });
}
function openPreview(cmd, opts){
  opts = opts || {};
  var dry;
  try { dry = PMM.saveProjectChange(S(), cmd); }
  catch (e){ if (e.code === "stale") return openConflict(cmd); if (e.code === "invalid") return; throw e; }
  ui.pending = { cmd:cmd, opts:opts };
  var back = opts.fromEdit ? '<button class="btn ti" type="button" data-act="' + (opts.inline ? "closesheet" : "backedit") + '">' + esc(t("backEdit")) + "</button>" : "";
  if (dry.result.kind === "no_change"){
    return openSheet(t("pvNone"), '<p style="margin:0">' + esc(t("pvNoneBody")) + "</p>",
      back + '<button class="btn tk" type="button" data-act="commit">' + esc(t("ok")) + "</button>");
  }
  var mids = dry.result.movements || [dry.result.movement];
  var m = { diff:dry.S.movements.filter(function(x){ return mids.indexOf(x.id) >= 0; }).map(function(x){ return x.diff[0]; }) };
  var body = '<ul class="diff">' + m.diff.map(diffRow).join("") + "</ul>";
  var nx = m.diff.filter(function(x){ return x.f === "next"; })[0];
  body += '<div style="margin-top:14px"><button class="switch" type="button" role="switch" aria-checked="false" data-sw="corr"><i></i><span>' + esc(t("markCorr")) + "</span></button></div>";
  if (nx && nx.old && !opts.fromUpdate){
    var pre = ui.presetPrev;
    body += '<div class="field"><span class="lab">' + esc(t("prevQ")) + '</span><div class="seg ti" data-seg="prev" data-optional="1">' +
      ["done","not","back"].map(function(v){ return '<button type="button" data-v="' + v + '" aria-pressed="' + (pre === v) + '">' + esc(t(v === "done" ? "done" : v === "not" ? "notDone" : "backList")) + "</button>"; }).join("") + "</div></div>";
  }
  openSheet(mids.length === 1 ? t("pvTitle") : t("pvTitleN", { n:mids.length }), body, back + '<button class="btn tk" type="button" data-act="commit">' + esc(t("save")) + "</button>", function(sh){ wireSwitches(sh); wireSegs(sh); });
}
/* before → after, shown on the entry itself (the movement itself is already named in the summary) */
function baLine(m){
  if (!m || m.init) return "";
  return m.diff.filter(function(x){ return x.f !== "next"; }).map(function(x){
    var o = x.f === "blockers" ? (x.old || []).join(", ") : valText(x.f, x.old), n = x.f === "blockers" ? (x["new"] || []).join(", ") : valText(x.f, x["new"]);
    return '<span class="ba"><span class="bo' + (o ? "" : " none") + '">' + esc(o || t("emptyVal")) + '</span><span class="arr" aria-hidden="true">→</span><span class="bn' + (n ? "" : " none") + '">' + esc(n || t("emptyVal")) + "</span></span>";
  }).join("");
}
function diffRow(x){
  var f = x.f, h = '<li><span class="k">' + esc(t("f_" + f)) + "</span>";
  if (f === "blockers"){
    var added = x["new"].filter(function(b){ return x.old.indexOf(b) < 0; }), removed = x.old.filter(function(b){ return x["new"].indexOf(b) < 0; });
    removed.forEach(function(b){ h += '<span class="new rem">− ' + esc(b) + "</span>"; });
    added.forEach(function(b){ h += '<span class="new add">+ ' + esc(b) + "</span>"; });
    if (!added.length && !removed.length) h += '<span class="new">' + esc(x["new"].join("\n")) + "</span>";
    return h + "</li>";
  }
  var o = valText(f, x.old), n = valText(f, x["new"]);
  if (o) h += '<span class="old">' + esc(o) + "</span>";
  h += n ? '<span class="new' + (o ? "" : " add") + '">' + esc(n) + "</span>" : '<span class="new none">' + esc(t("emptyVal")) + "</span>";
  return h + "</li>";
}
function commitPending(){
  var pd = ui.pending; if (!pd) return;
  var sh = scrim.querySelector(".sheet"), cmd = pd.cmd;
  var corr = sh.querySelector('[data-sw="corr"]'); cmd.correction = !!(corr && corr.getAttribute("aria-checked") === "true");
  var prev = pd.opts && pd.opts.fromUpdate ? ui.presetPrev : segVal(sh, "prev"); cmd.prev = prev || null;
  var p = S().projects[cmd.project];
  if (cmd.prev === "back" && p.data.next){
    var list = (cmd.up || p.up).slice(); list.unshift({ text:p.data.next }); cmd.up = list;
  }
  var r = attempt(function(s){ return PMM.saveProjectChange(s, cmd); });
  if (!r.ok){
    if (r.error.code === "stale") return openConflict(cmd);
    closeSheet(); return toast(t("errSave"));
  }
  dropDraft(cmd.project); ui.presetPrev = null; if (ui.pedit){ ui.pedit = false; ui.edit = null; }
  closeSheet(); render();
  if (r.result.kind === "saved"){
    var mid = r.result.movement, nm = (r.result.movements || [mid]).length;
    toast(nm === 1 ? t("saved") : t("savedN", { n:nm }), t("addExpl"), function(){ openAnnotate(mid); });
  } else toast(t("savedNone"));
}
function openConflict(cmd){
  ui.pending = { cmd:cmd, conflict:true };

  var body = '<p style="margin:0">' + esc(t("cfBody")) + "</p>" + newer.map(function(m){
    return '<div class="card" style="margin-top:12px"><span class="lab">' + esc(fmtDT(m.at)) + '</span><ul class="diff">' + m.diff.map(diffRow).join("") + "</ul></div>";
  }).join("");
  openSheet(t("cfTitle"), body, '<button class="btn ti" type="button" data-act="cfdiscard">' + esc(t("discardMine")) + '</button><button class="btn tk" type="button" data-act="cfapply">' + esc(t("reapply")) + "</button>");
}

function loadSamples(){

    function at(dd, hh, mm){ var d = new Date(now); d.setDate(d.getDate() + dd); d.setHours(hh, mm, 0, 0); return d.toISOString(); }

    s = PMM.scheduleSession(s, { id:PMM.uid(), project:p1, date:plus(1), time:"09:30", sessions:1 }).S;
    x = PMM.saveProjectChange(s, { id:PMM.uid(), project:p1, expectedRev:s.projects[p1].rev, edits:{ checkpoint:plus(7) } }, at(-6, 11, 20)); s = x.S;
    s = PMM.annotate(s, x.result.movement, { explanation:L.h2e, magnitude:"minor", direction:"neutral" }, at(-6, 11, 25)).S;

    s = PMM.recordAttempt(s, { id:PMM.uid(), project:p2, date:ws, sessions:4 }).S;
    s = PMM.recordAttempt(s, { id:PMM.uid(), project:p3, date:ws, sessions:2 }).S;
    s = PMM.setCapacity(s, null, 7, true).S;
    ui.pid = p1;
    return { S:s, result:{ kind:"samples" } };

  var x = cvItem(id); if (!x) return;
  var desc = followersOf(cvG, id), p = proj();
  var opts = (p.data.next ? [{ id:"cur", text:p.data.next + " · " + t("f_next") }] : []).concat(cvG.filter(function(y){ return y.id !== id && !desc[y.id]; }));
  var body = '<p class="note" style="margin:0 0 8px">' + esc(t("cvAfterQ")) + '</p><ul class="arealist">' + opts.map(function(o){
    return '<li><button class="switch" type="button" role="switch" data-cvafter="' + esc(o.id) + '" aria-checked="' + (x.after.indexOf(o.id) >= 0) + '"><i></i><span>' + esc(o.text) + "</span></button></li>"; }).join("") + "</ul>" +
    '<p class="note">' + esc(t("cvAfterNone")) + '</p><ul class="picklist"><li><button type="button" data-cvdo="note" data-id="' + esc(id) + '">' + esc(t("entNote") + " · " + t("magnitude")) + '</button></li><li><button type="button" data-cvdo="remove" data-id="' + esc(id) + '" style="color:var(--cop)">' + esc(t("remove")) + "</button></li></ul>";
  ui.cvFor = id;
  openSheet(x.text, body, '<button class="btn tk" type="button" data-act="closesheet">' + esc(t("rvClose")) + "</button>", function(sh){ wireSwitches(sh); });
}
document.addEventListener("click", function(e){
  if (!cvG) return;
  var sw = e.target.closest("[data-cvafter]");
  if (sw){ setTimeout(function(){
      var x = cvItem(ui.cvFor); if (!x) return;
      x.after = [].filter.call(scrim.querySelectorAll("[data-cvafter]"), function(b){ return b.getAttribute("aria-checked") === "true"; }).map(function(b){ return b.dataset.cvafter; });
      cvSave(); paintCanvas(); }, 0); return; }
  var b = e.target.closest("[data-cvdo]"); if (!b) return;
  var id = b.dataset.id, x = cvItem(id); if (!x) return;
  closeSheet();
  if (b.dataset.cvdo === "note") return openMvNote(x.text);
  if (b.dataset.cvdo === "remove"){
    cvG.forEach(function(y){ var k = y.after.indexOf(id); if (k >= 0){ y.after.splice(k, 1); x.after.forEach(function(a){ if (y.after.indexOf(a) < 0) y.after.push(a); }); } });
    cvG = cvG.filter(function(y){ return y.id !== id; }); cvSave(); paintCanvas();
  }
});

/* ---------- Android back: close what's on top, then step back to the Portfolio, then leave ---------- */
function backOnce(){
  if (typeof dpEl !== "undefined" && dpEl && !dpEl.hidden){ dpClose(); return true; }
  if (typeof sdEl !== "undefined" && sdEl && !sdEl.hidden){ sdClose(); return true; }
  if (!scrim.hidden){ closeSheet(); return true; }
  if (cvG){ closeCanvas(); return true; }
  if (ui.pedit){ var c = document.querySelector('[data-act="pecancel"]'); if (c){ c.click(); return true; } }
  if (ui.att && ui.att.edit && ui.tab === "portfolio"){ readPlanDom(); ui.att.edit = false; render(); toast(t("draftKept")); return true; }
  if (ui.tab === "review" && ui.rv && ui.rv.step === 3){ ui.rv.step = 2; saveRv(); render(); scrollTo(0, 0); return true; }
  if (ui.tab !== "portfolio"){ ui.tab = "portfolio"; remember(); render(); scrollTo(0, 0); return true; }
  return false;
}
try {
  history.replaceState({ pm:"base" }, "");
  history.pushState({ pm:"guard" }, "");
  window.addEventListener("popstate", function(e){
    if (ui.leaving) return;
    if (backOnce()) history.pushState({ pm:"guard" }, "");
    else { ui.leaving = true; history.back(); }   /* nothing left to close: let the system leave the app */
  });
} catch (e){}

applyTheme(); applyLang(); render();
startSync();
/* the first visit of a new day opens on Today */
(function(){ var td = todayISO(); if (prefs.lastDay !== td){ if (prefs.lastDay && S().order.length){ ui.tab = "today"; render(); } prefs.lastDay = td; savePrefs(); } })();
setTimeout(function(){ if (!prefs.howSeen) openHow(); else if (ui.tab !== "today") showReminders(); }, 600);
if (navigator.storage && navigator.storage.persist) try { navigator.storage.persist().catch(function(){}); } catch (e){}
})();
